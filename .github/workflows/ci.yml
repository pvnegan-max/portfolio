
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Vérifier le portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les fichiers du portfolio
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Tous les fichiers sont présents !"
